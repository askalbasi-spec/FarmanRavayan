name: Android APK

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create --platforms=android --org=ir.farmanravayan .

      - name: Show Poolakey plugin gradle file
        run: |
          f=$(ls -d $HOME/.pub-cache/hosted/pub.dev/flutter_poolakey-*/android/build.gradle* | head -1)
          echo "$f"
          sed -i 's/jcenter()/mavenCentral()/g' "$f"
          cat "$f"
          echo "::warning title=poolakeygradle::$(cat $f | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

      - name: Allow JitPack (Cafe Bazaar billing library)
        run: |
          python3 - <<'PY'
          import glob
          for f in glob.glob('android/build.gradle*'):
              s = open(f).read()
              if 'jitpack' in s:
                  continue
              add = 'maven { url = uri("https://jitpack.io") }' if f.endswith('.kts') else "maven { url 'https://jitpack.io' }"
              s = s.replace('mavenCentral()', 'mavenCentral()\n        ' + add)
              open(f, 'w').write(s)
              print('patched', f)
          PY

      - name: Apply app icon and Persian app name
        run: |
          cp -r assets/icon/android/mipmap-* android/app/src/main/res/
          sed -i 's/android:label="[^"]*"/android:label="فرمانروایان"/' android/app/src/main/AndroidManifest.xml
          grep -n "android:label" android/app/src/main/AndroidManifest.xml

      - name: Disable R8 shrinking (ad SDK is not compatible with it)
        run: |
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('android/app/build.gradle*'):
              s = open(f).read()
              if f.endswith('.kts'):
                  add = '            isMinifyEnabled = false\n            isShrinkResources = false\n'
              else:
                  add = '            minifyEnabled false\n            shrinkResources false\n'
              s, n = re.subn(r'(buildTypes\s*\{\s*(?:getByName\("release"\)|release)\s*\{\n)', lambda m: m.group(1) + add, s, count=1)
              open(f, 'w').write(s)
              print('patched', f, n)
              print(s[s.find('buildTypes'):][:400])
          PY

      - name: Configure release signing (only when the keystore secret exists)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('android/app/build.gradle*'):
              s = open(f).read()
              if f.endswith('.kts'):
                  block = 'android {\n    signingConfigs {\n        create("release") {\n            storeFile = file("upload.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }\n'
                  s = s.replace('android {\n', block, 1)
                  s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
              else:
                  block = "android {\n    signingConfigs {\n        release {\n            storeFile file('upload.jks')\n            storePassword System.getenv('KEYSTORE_PASSWORD')\n            keyAlias System.getenv('KEY_ALIAS')\n            keyPassword System.getenv('KEY_PASSWORD')\n        }\n    }\n"
                  s = s.replace('android {\n', block, 1)
                  s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              open(f, 'w').write(s)
              print('patched', f)
          PY

      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          code=$?
          cat analyze.log
          if [ $code -ne 0 ]; then
            echo "::error title=flutter analyze::$(head -c 6000 analyze.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          grep -E "SIM " test.log | while read -r l; do echo "::notice title=balance::$l"; done
          code=$?
          tail -n 80 test.log
          if [ $code -ne 0 ]; then
            grep -E "EXCEPTION|overflowed|relevant error-causing|creator:|Expected|Actual|Which is|Failed|failed|Error|error:|file:///home" test.log | head -60 > test.summary
            echo "::error title=flutter test::$(head -c 6000 test.summary | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

      - name: Build optimized test APKs
        run: |
          set +e
          flutter build apk --release --split-per-abi --dart-define=BAZAAR_RSA_KEY=${{ secrets.BAZAAR_RSA_KEY }} --dart-define=ADIVERY_APP_ID=${{ secrets.ADIVERY_APP_ID }} --dart-define=ADIVERY_REWARDED_ID=${{ secrets.ADIVERY_REWARDED_ID }} > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            grep -nE "error|Error|FAILURE|What went wrong|Could not|not found|Unresolved|jitpack|Execution failed" -A3 build.log | head -50 > build.summary
            echo "::error title=flutter build::$(head -c 6000 build.summary | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

      - name: Build single signed APK for Cafe Bazaar
        if: env.HAS_KEYSTORE == 'true' && github.ref == 'refs/heads/main'
        run: |
          set +e
          flutter build apk --release --dart-define=BAZAAR_RSA_KEY=${{ secrets.BAZAAR_RSA_KEY }} --dart-define=ADIVERY_APP_ID=${{ secrets.ADIVERY_APP_ID }} --dart-define=ADIVERY_REWARDED_ID=${{ secrets.ADIVERY_REWARDED_ID }} > store.log 2>&1
          code=$?
          tail -n 30 store.log
          if [ $code -ne 0 ]; then
            echo "::error title=store build::$(grep -nE 'error|Error|What went wrong|Could not' -A3 store.log | head -40 | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $code
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/farmanravayan-bazaar.apk

      - name: Publish store APK
        if: env.HAS_KEYSTORE == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: farmanravayan-store-build
          name: FarmanRavayan Store Build (signed)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/farmanravayan-bazaar.apk
          body: Single signed APK intended for Cafe Bazaar upload.

      - name: Publish test APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: farmanravayan-test-build
          name: FarmanRavayan Android Test Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/app/outputs/flutter-apk/*-release.apk
          body: |
            Optimized Android test builds for ARMv7, ARM64 and x86_64.
            These builds use the temporary debug signing key and are for testing only, not store publication.
