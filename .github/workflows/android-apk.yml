name: Android APK

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create --platforms=android --org=ir.farmanravayan .

      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          code=$?
          cat analyze.log
          if [ $code -ne 0 ]; then
            echo "::error title=flutter analyze::$(head -c 6000 analyze.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          tail -n 80 test.log
          if [ $code -ne 0 ]; then
            echo "::error title=flutter test::$(tail -c 6000 test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

      - name: Build optimized test APKs
        run: flutter build apk --release --split-per-abi

      - name: Publish test APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: farmanravayan-test-build
          name: FarmanRavayan Android Test Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/app/outputs/flutter-apk/*-release.apk
          body: |
            Optimized Android test builds for ARMv7, ARM64 and x86_64.
            These builds use the temporary debug signing key and are for testing only, not store publication.
